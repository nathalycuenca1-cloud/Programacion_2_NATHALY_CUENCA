<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar autor</title>
</head>
<body>
    <div>
        <div>
            <h1>Eliminar autor</h1>
            <p>¿Estás seguro de que quieres eliminar el autor "{{ autor.nombre }}" "{{ autor.apellido}}?</p>
            <form method="POST">
                {% csrf_token %}
                <div>
                    <button type="submit">Sí, eliminar</button>
                    <a href="{% url 'autor_list' %}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
