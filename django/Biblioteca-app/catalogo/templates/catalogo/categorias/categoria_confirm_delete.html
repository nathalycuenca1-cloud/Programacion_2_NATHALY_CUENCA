<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar categoría</title>
    <style>
        body {
            margin: 0;
            font-family: Georgia, serif;
            background: #dfe8e7;
            color: #2f3b45;
        }
        .container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            width: 100%;
            max-width: 500px;
            background: rgba(255,255,255,0.12);
            padding: 30px;
            box-sizing: border-box;
        }
        h1 {
            margin-top: 0;
            font-size: 2.3rem;
        }
        .actions {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        button {
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 16px;
            cursor: pointer;
        }
        a {
            color: #0f5ec8;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Eliminar categoría</h1>
            <p>¿Estás seguro de que quieres eliminar la categoría "{{ categoria.nombre }}"?</p>
            <form method="POST">
                {% csrf_token %}
                <div class="actions">
                    <button type="submit">Sí, eliminar</button>
                    <a href="{% url 'categoria_list' %}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
