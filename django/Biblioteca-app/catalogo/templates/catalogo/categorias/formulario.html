<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Biblioteca</title>
    <style>
        body {
            margin: 0;
            font-family: Georgia, serif;
            background: #ffffff; /* Fondo de la página completamente blanco */
            color: #2c3e50;      /* Texto oscuro para buena lectura */
        }
        .container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 0;
        }
        .card {
            width: 100%;
            max-width: 700px;
            background: #ffffff; /* Fondo de la tarjeta también blanco */
            padding: 30px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 2.8rem;
            margin: 0 0 15px;
            color: #2c3e50;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.5;
            color: #555;
        }
        h2 {
            margin-top: 30px;
            color: #2c3e50;
        }
        ul {
            list-style-type: disc;
            padding-left: 20px;
        }
        li {
            margin: 8px 0;
        }
        a {
            color: #0f5ec8;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Inicio</h1>
            <p>Bienvenido a la aplicación de gestión de libros.</p>
            <p>Desde aquí puedes gestionar los libros disponibles en la biblioteca.</p>
            
            <h2>Menú Principal</h2>
            <ul>
                <li><a href="{% url 'libro_list' %}">Lista de Libros</a></li>
                <li><a href="{% url 'categoria_list' %}">Lista de Categorías</a></li>
            </ul>
        </div>
    </div>
</body>
</html>
