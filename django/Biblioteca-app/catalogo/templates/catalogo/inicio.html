<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <style>
        body {
            margin: 0;
            font-family: Georgia, serif;
            background: #dfe8e7;
            color: #2f3b45;
        }
        .page {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 0;
        }
        .panel {
            width: 100%;
            max-width: 1200px;
            background: rgba(255, 255, 255, 0.18);
            padding: 30px 50px 40px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 3.1rem;
            margin: 0 0 24px;
            color: #2b3a40;
            font-weight: 700;
        }
        h2 {
            font-size: 2.2rem;
            margin: 30px 0 20px;
            color: #2b3a40;
        }
        p {
            font-size: 1.3rem;
            line-height: 1.6;
            margin: 0 0 12px;
        }
        ul {
            list-style: disc;
            padding-left: 35px;
            margin-top: 18px;
        }
        li {
            margin: 18px 0;
            font-size: 1.2rem;
        }
        a {
            color: #0d5ec7;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="panel">
            <h1>Inicio</h1>

            <p>Bienvenido a la aplicación de gestión de libros.</p>
            <p>Desde aquí puedes gestionar los libros disponibles en la biblioteca.</p>

            <h2>Menú Principal</h2>
            <ul>
                <li><a href="{% url 'libro_list' %}">Lista de Libros</a></li>
                <li><a href="{% url 'categoria_list' %}">Lista de Categorías</a></li>
                <li><a href="{% url 'autor_list' %}">Lista de Autores</a></li>
            </ul>
        </div>
    </div>
</body>
</html>
