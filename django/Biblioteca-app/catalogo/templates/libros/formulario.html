<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if form.instance.pk %}Editar libro{% else %}Nuevo libro{% endif %}</title>
</head>
<body>
    <h1>{% if form.instance.pk %}Editar libro{% else %}Nuevo libro{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar</button>
        <a href="{% url 'libro_list' %}">Cancelar</a>
    </form>
</body>
</html>
